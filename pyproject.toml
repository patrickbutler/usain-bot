[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usain-bot"
version = "0.1.0"
description = "Local-first, agentic adaptive running coach built on real Garmin activity history."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyYAML>=6.0",
    "garminconnect>=0.2.17",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
usain-bot = "usain_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
