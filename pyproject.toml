[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usain-bot"
version = "0.1.0"
description = "Local-first, agentic adaptive running coach built on real Garmin activity history."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyYAML>=6.0",
    "garminconnect>=0.2.17",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
chat = [
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
]

[project.scripts]
usain-bot = "usain_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usain_bot = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
